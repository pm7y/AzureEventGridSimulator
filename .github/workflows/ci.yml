name: "AEGS: CI"

on:
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"
  # Build specific projects, not the solution (excludes Aspire projects from CI)
  MAIN_PROJECT: ./src/AzureEventGridSimulator/AzureEventGridSimulator.csproj
  TEST_PROJECT: ./src/AzureEventGridSimulator.Tests/AzureEventGridSimulator.Tests.csproj
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: "AEGS: Build & Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.MAIN_PROJECT }} --runtime ${{ matrix.runtime }}
          dotnet restore ${{ env.TEST_PROJECT }} --runtime ${{ matrix.runtime }}

      - name: Build main project
        run: >-
          dotnet build ${{ env.MAIN_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0
          --runtime ${{ matrix.runtime }}
          --no-restore
          --no-incremental
          /p:WarningLevel=4
          /p:TreatWarningsAsErrors=true

      - name: Build test project
        run: >-
          dotnet build ${{ env.TEST_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0
          --runtime ${{ matrix.runtime }}
          --no-restore
          --no-incremental
          /p:WarningLevel=4
          /p:TreatWarningsAsErrors=true

      - name: Test
        run: >-
          dotnet test ${{ env.TEST_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0
          --runtime ${{ matrix.runtime }}
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --filter "Category=unit|Category=integration"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          retention-days: 7
