name: "AEGS: Docker Release"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g., '1.0.1')"
        required: true
        type: string

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION_NUMBER: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
  REGISTRY: docker.io
  IMAGE_NAME: pmcilreavy/azureeventgridsimulator

jobs:
  build-and-push:
    name: "AEGS: Docker Build & Push"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Build the tagged commit, not whatever the dispatched ref (master) points at now.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION_NUMBER }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Take sha/ref from the checked-out tag, so the image's revision label names the
          # commit that was built rather than github.sha (master HEAD on a dispatch).
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION_NUMBER }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION_NUMBER }}
            type=semver,pattern={{major}},value=${{ env.VERSION_NUMBER }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION_NUMBER, '-') }}

      - name: Build and push Docker images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./docker/README.md
