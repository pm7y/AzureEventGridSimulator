name: "AEGS: Release"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g., '1.0.1')"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION_NUMBER: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"
  # Build specific projects, not the solution (excludes Aspire projects from release)
  MAIN_PROJECT: ./src/AzureEventGridSimulator/AzureEventGridSimulator.csproj
  TEST_PROJECT: ./src/AzureEventGridSimulator.Tests/AzureEventGridSimulator.Tests.csproj
  CONFIGURATION: Release
  ARTIFACT_PATH: ./dist

jobs:
  build-test-publish:
    name: "AEGS: Build (${{ matrix.runtime }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-arm64

    steps:
      # Build the tagged commit, not whatever the dispatched ref (master) points at now.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION_NUMBER }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          # Package versions live in Directory.Packages.props (Central Package Management),
          # so the key must hash it as well as the project files.
          cache-dependency-path: |
            **/*.csproj
            src/Directory.Packages.props
            src/Directory.Build.props
            nuget.config

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.MAIN_PROJECT }} --runtime ${{ matrix.runtime }}
          dotnet restore ${{ env.TEST_PROJECT }} --runtime ${{ matrix.runtime }}

      # Also builds the main project, through the test project's ProjectReference
      # (the /p:Version global property flows to it).
      - name: Build
        run: >-
          dotnet build ${{ env.TEST_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ matrix.runtime }}
          --no-restore
          /p:Version=${{ env.VERSION_NUMBER }}

      - name: Test
        run: >-
          dotnet test ${{ env.TEST_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ matrix.runtime }}
          --no-build
          --verbosity normal
          --filter "Category!=integration-actual"

      - name: Publish
        run: >-
          dotnet publish ${{ env.MAIN_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ matrix.runtime }}
          --no-restore
          --self-contained true
          /p:Version=${{ env.VERSION_NUMBER }}
          /p:PublishReadyToRun=false
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          --output ${{ env.ARTIFACT_PATH }}

      - name: Create archive (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ env.ARTIFACT_PATH }}
        run: |
          zip -r ../AzureEventGridSimulator-${{ matrix.runtime }}-${{ env.VERSION_NUMBER }}.zip .
          cd ..
          sha256sum AzureEventGridSimulator-${{ matrix.runtime }}-${{ env.VERSION_NUMBER }}.zip > AzureEventGridSimulator-${{ matrix.runtime }}-${{ env.VERSION_NUMBER }}.zip.sha256

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.ARTIFACT_PATH }}
        shell: pwsh
        run: |
          Compress-Archive -Path * -DestinationPath ../AzureEventGridSimulator-${{ matrix.runtime }}-${{ env.VERSION_NUMBER }}.zip
          cd ..
          $hash = (Get-FileHash -Algorithm SHA256 AzureEventGridSimulator-${{ matrix.runtime }}-${{ env.VERSION_NUMBER }}.zip).Hash.ToLower()
          "$hash  AzureEventGridSimulator-${{ matrix.runtime }}-${{ env.VERSION_NUMBER }}.zip" | Out-File -Encoding utf8 AzureEventGridSimulator-${{ matrix.runtime }}-${{ env.VERSION_NUMBER }}.zip.sha256

      - name: Upload release artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ env.VERSION_NUMBER }}
          tag_name: ${{ env.VERSION_NUMBER }}
          files: |
            AzureEventGridSimulator-${{ matrix.runtime }}-${{ env.VERSION_NUMBER }}.zip
            AzureEventGridSimulator-${{ matrix.runtime }}-${{ env.VERSION_NUMBER }}.zip.sha256
          fail_on_unmatched_files: true
