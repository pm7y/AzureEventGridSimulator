name: "AEGS: NuGet Release"

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g., '1.0.1')"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION_NUMBER: ${{ github.event.inputs.tag_name || github.event.release.tag_name }}
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"
  PROJECT_PATH: ./src/AzureEventGridSimulator/AzureEventGridSimulator.csproj
  HOSTING_PROJECT_PATH: ./src/AzureEventGridSimulator.Aspire.Hosting/AzureEventGridSimulator.Aspire.Hosting.csproj
  CONFIGURATION: Release

jobs:
  publish-nuget:
    name: "AEGS: Publish to NuGet"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Lets the job request the OIDC token that nuget.org exchanges for a temporary API key
      id-token: write

    steps:
      # Build the tagged commit, not whatever the dispatched ref (master) points at now.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION_NUMBER }}

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet restore ${{ env.HOSTING_PROJECT_PATH }}

      - name: Build
        run: >-
          dotnet build ${{ env.PROJECT_PATH }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          /p:Version=${{ env.VERSION_NUMBER }}

      - name: Build Aspire hosting package
        run: >-
          dotnet build ${{ env.HOSTING_PROJECT_PATH }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          /p:Version=${{ env.VERSION_NUMBER }}

      - name: Pack
        run: >-
          dotnet pack ${{ env.PROJECT_PATH }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          /p:Version=${{ env.VERSION_NUMBER }}
          --output ./nupkg

      - name: Pack Aspire hosting package
        run: >-
          dotnet pack ${{ env.HOSTING_PROJECT_PATH }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          /p:Version=${{ env.VERSION_NUMBER }}
          --output ./nupkg

      # Trusted Publishing: nuget.org checks this run against the policy registered for this
      # workflow file and returns an API key that lasts an hour, so it's requested just before
      # the push. Renaming this file breaks the policy until it's updated on nuget.org.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push ./nupkg/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
