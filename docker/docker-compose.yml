services:
  azureeventgridsimulator:
    image: azureeventgridsimulator:dev
    container_name: azureeventgridsimulator-dev
    ports:
      # add a port mapping for each topic in the settings file
      - "60101:60101"
    volumes:
      # map this folder to a read-only folder '/aegs' in the container
      # this allows us to access files (e.g. settings or certificates) from within the container
      - .:/aegs:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # specify cert details note: can be generated like so:
      # dotnet dev-certs https --export-path ./azureEventGridSimulator.pfx --password Y0urSup3rCrypt1cPa55w0rd!
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/aegs/azureEventGridSimulator.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Y0urSup3rCrypt1cPa55w0rd!

      # topics, subscribers, and logging config
      - AEGS_ConfigFile=/aegs/appsettings.docker.json

    depends_on:
      - servicebus-emulator
      - azurite
      - seq

    networks:
      - aegs-network

    build:
      context: ..
      dockerfile: ./docker/Dockerfile

  # Seq - Structured Log Server
  # See: https://docs.datalust.co/docs/getting-started-with-docker
  seq:
    container_name: seq
    image: datalust/seq:latest
    ports:
      - "5341:5341"   # Ingestion API
      - "8081:80"     # Web UI
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      aegs-network:
        aliases:
          - seq

  # Azurite - Azure Storage Emulator
  # See: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azurite
  azurite:
    container_name: azurite
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"   # Blob service
      - "10001:10001"   # Queue service
      - "10002:10002"   # Table service
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    networks:
      aegs-network:
        aliases:
          - azurite

  # Azure Service Bus Emulator
  # See: https://learn.microsoft.com/en-us/azure/service-bus-messaging/test-locally-with-service-bus-emulator
  servicebus-emulator:
    container_name: servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"   # AMQP port
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStr0ngP@ssword!}
      ACCEPT_EULA: "Y"
    depends_on:
      - mssql
    networks:
      aegs-network:
        aliases:
          - servicebus-emulator

  mssql:
    container_name: mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStr0ngP@ssword!}
    networks:
      aegs-network:
        aliases:
          - mssql

networks:
  aegs-network:
